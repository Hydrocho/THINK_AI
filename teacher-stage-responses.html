<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>학생 작성 글 보기 | THINK</title>
  <link rel="stylesheet" href="styles/main.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="teacher-stage-response-page">
  <main class="stage-response-shell">
    <a class="stage-response-back" href="index.html">← 수업 운영으로 돌아가기</a>
    <header id="stageResponseHeader" class="stage-response-header" aria-live="polite">
      <p id="stageResponseContext" class="stage-response-eyebrow">수업 정보를 불러오는 중입니다.</p>
      <h1 id="stageResponseTitle">학생 작성 글 보기</h1>
      <p id="stageResponseQuestion" class="stage-response-question"></p>
      <p id="stageResponseAccess" class="stage-response-access"></p>
    </header>
    <div id="stageResponseError" class="stage-response-error" role="alert" hidden></div>
    <nav class="stage-response-tabs" aria-label="학생 글과 학급 인사이트">
      <button type="button" id="studentWritingTab" class="stage-response-tab is-active" aria-selected="true">학생별 글 보기</button>
      <button type="button" id="classInsightsTab" class="stage-response-tab" aria-selected="false">학급 인사이트 ✨</button>
    </nav>
    <section id="studentWritingPanel">
      <div class="stage-response-toolbar">
        <div id="responseSummary" class="stage-response-summary"></div>
        <div class="stage-response-controls">
          <label>필터 <select id="responseFilter"><option value="all">전체</option><option value="writing">작성함</option><option value="not_started">미작성</option><option value="submitted">제출 완료</option></select></label>
          <label>정렬 <select id="responseSort"><option value="updated">마지막 저장순</option><option value="student_number">학생 번호순</option></select></label>
        </div>
      </div>
      <div class="stage-response-grid">
        <aside class="stage-response-roster" aria-label="학생 작성 현황"><h2>학생 작성 현황</h2><div id="studentResponseList"></div></aside>
        <article id="selectedStudentResponse" class="stage-response-detail" aria-live="polite"><p class="stage-response-empty">학생을 선택해 주세요.</p></article>
      </div>
    </section>
    <section id="classInsightsPanel" class="class-insights-panel" hidden>
      <div class="class-insight-card"><h2>작성 현황</h2><div id="insightSummary" class="stage-response-summary"></div></div>
      <div class="class-insight-card"><h2>핵심 표현 워드 클라우드</h2><p class="class-insight-help">학생 글에서 자주 나온 표현을 이 브라우저에서만 집계합니다.</p><div id="wordCloud" class="teacher-word-cloud"></div></div>
      <div class="class-insight-card">
        <div class="class-insight-heading"><div><h2>AI 학급 인사이트</h2><p class="class-insight-help">학생 신원 없이 학급 전체 경향만 Gemini로 분석합니다.</p></div><button type="button" id="generateClassInsightButton" class="btn btn-primary">AI 학급 요약 생성</button></div>
        <div id="classInsightResult" aria-live="polite"><p class="stage-response-empty">버튼을 누르면 현재 단계의 학급 경향을 분석합니다.</p></div>
      </div>
    </section>
  </main>
  <script src="js/supabase-keys.js"></script>
  <script src="js/supabase-client.js"></script>
  <script type="module" src="js/modules/teacherStageResponses.js"></script>
</body>
</html>
