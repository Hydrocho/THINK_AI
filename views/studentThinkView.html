<!-- Main App Content (Student THINK View - Hidden until student enters lesson) -->
<main id="studentAppSection" class="main-shell" style="display: none;">

  <!-- Sidebar Navigation: LMS Style Course Navigation -->
  <aside class="sidebar">
    <div style="margin-bottom: 16px;">
      <button type="button" class="btn btn-secondary" onclick="StudentLobbyModule.exitToLobby()"
        style="width: 100%; padding: 7px 12px; font-size: 0.84rem; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; gap: 6px; border-color: var(--border-medium); background: #ffffff;">
        ← 수업 로비로
      </button>
    </div>

    <div>
      <div class="sidebar-title">진행 중인 프로젝트</div>
      <div class="activity-badge-box" style="margin-top: 10px;">
        <div class="activity-topic-title" id="currentProjectTitle">진행 중인 프로젝트</div>
        <div class="activity-lesson-num" id="currentLessonLabel">1주제 활동 진행 중</div>
      </div>
    </div>

    <div style="margin-top: 20px;">
      <div class="sidebar-title" style="margin-bottom: 12px;">THINK 5단계 프로세스</div>
      <ul class="think-steps-list" id="studentThinkStepsList">

        <li class="think-step-item active" id="stepNavItem-1" onclick="App.goToStep(1)">
          <span class="step-icon-badge">T</span>
          <span>나의 처음 생각</span>
        </li>
        <li class="think-step-item" id="stepNavItem-2" onclick="App.goToStep(2)">
          <span class="step-icon-badge">H</span>
          <span>친구와 생각 나누기</span>
        </li>
        <li class="think-step-item" id="stepNavItem-3" onclick="App.goToStep(3)">
          <span class="step-icon-badge">I</span>
          <span>인공지능과 생각 넓히기</span>
        </li>
        <li class="think-step-item" id="stepNavItem-4" onclick="App.goToStep(4)">
          <span class="step-icon-badge">N</span>
          <span>비판적으로 따져보기</span>
        </li>
        <li class="think-step-item" id="stepNavItem-5" onclick="App.goToStep(5)">
          <span class="step-icon-badge">K</span>
          <span>나의 최종 생각</span>
        </li>
      </ul>
    </div>

  </aside>

  <!-- Main Step View Panel -->
  <section class="content-area">
    <div class="question-pin-anchor">
      <div id="questionPin" class="question-pin" hidden>
        <span class="question-pin-desktop"></span>
        <details class="question-pin-mobile">
          <summary><span class="question-pin-preview"></span></summary>
        </details>
      </div>
    </div>

    <!-- Step Header -->
    <div class="step-header">
      <h1 class="step-main-title" id="stepMainTitle">사람에게 나타나는 다양한 특징 중 부모에게서 물려받는 것은 어떤 것이 있을까?</h1>
      <details id="thinkBackground" class="think-t-example think-background" hidden>
        <summary>배경 설명 보기</summary>
        <p id="thinkBackgroundText"></p>
      </details>
    </div>

    <!-- Step Dynamic Body Container -->
    <div id="stepContentContainer">
      <!-- Step 1 to 5 dynamic contents injected by JS -->
    </div>

  </section>

</main>
