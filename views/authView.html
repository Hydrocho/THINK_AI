<!-- Auth View (Initial default screen) -->
<section id="authSection" class="main-shell" style="display: grid; grid-template-columns: 1fr;">
  <div style="max-width: 480px; margin: 60px auto; width: 100%; padding: 0 20px;">
    <div style="text-align: center; margin-bottom: 28px;">
      <h2 style="font-size: 1.6rem; color: var(--text-main); margin-bottom: 8px;">THINK AI 활용 생각 교실 로그인</h2>
      <p style="color: var(--text-subtle); font-size: 0.95rem;">선생님 또는 학생 계정으로 로그인해 주세요.</p>
    </div>

    <!-- Login Tabs -->
    <div style="display: flex; gap: 8px; margin-bottom: 24px; background: var(--bg-subtle); padding: 4px; border-radius: var(--radius-md);">
      <button class="btn btn-primary" id="tabStudentLogin" style="flex: 1; padding: 10px;" onclick="App.switchAuthTab('student')">학생 로그인</button>
      <button class="btn btn-secondary" id="tabTeacherLogin" style="flex: 1; padding: 10px;" onclick="App.switchAuthTab('teacher')">교사 (Google)</button>
    </div>

    <!-- Student Login Form -->
    <form id="studentLoginForm" onsubmit="App.handleStudentLogin(event)" style="display: flex; flex-direction: column; gap: 16px;">
      <div class="form-group">
        <label class="form-label">학번 (학년 1자리 + 반 2자리 + 번호 2자리)</label>
        <input type="text" id="inputStudentNum" class="form-input" placeholder="학번 5자리 입력 (예: 30208)" required>
      </div>
      <div class="form-group">
        <label class="form-label">비밀번호</label>
        <input type="password" id="inputStudentPw" class="form-input" placeholder="비밀번호 입력" required>
      </div>
      <button type="submit" class="btn btn-primary" style="margin-top: 8px; padding: 14px;">학생 로그인하기</button>
      <p style="font-size: 0.8rem; color: var(--text-subtle); text-align: center; margin-top: 8px;">
        * 학번과 비밀번호를 입력하여 접속하세요.
      </p>
    </form>

    <!-- Teacher Login Form -->
    <div id="teacherLoginForm" style="display: none; text-align: center; padding: 20px 0;">
      <p style="margin-bottom: 20px; color: var(--text-muted); font-size: 0.95rem;">
        선생님 전용 Google 계정 인증으로 안전하게 관리 화면에 접근합니다.
      </p>
      <button class="btn btn-primary" onclick="App.handleTeacherLogin()" style="width: 100%; padding: 14px; background: #ffffff; color: var(--text-main); border: 1px solid var(--border-medium);">
        <svg width="18" height="18" viewBox="0 0 24 24" style="margin-right: 8px;"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.1c-.22-.66-.35-1.36-.35-2.1s.13-1.44.35-2.1V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
        Google 계정으로 교사 로그인
      </button>
    </div>
  </div>
</section>
