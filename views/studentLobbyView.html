<!-- Student Lobby View (Shown only after login) -->
<section id="studentLobbySection" class="main-shell" style="display: none; grid-template-columns: 1fr;">
  <div style="max-width: 880px; margin: 32px auto; width: 100%; padding: 0 20px; display: flex; flex-direction: column; gap: 24px;">
    
    <!-- Welcome Header Card -->
    <div style="background: linear-gradient(135deg, var(--primary-700), var(--primary-800)); color: #ffffff; padding: 28px; border-radius: var(--radius-xl); box-shadow: var(--shadow-md); display: flex; justify-content: space-between; align-items: center;">
      <div>
        <div style="font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.08em; opacity: 0.9;">THINK AI 활용 생각 교실 로비</div>
        <h2 style="font-size: 1.6rem; font-weight: 800; margin-top: 4px;" id="lblWelcomeStudent">👋 안녕하세요!</h2>
        <p style="font-size: 0.9rem; opacity: 0.9; margin-top: 4px;">전자칠판 PIN 번호를 입력하거나 아래 개방된 수업 카드를 눌러 진입하세요.</p>
      </div>
    </div>

    <!-- 6-Digit PIN Entrance Card -->
    <div style="background: var(--bg-card); border: 2px solid var(--primary-200); padding: 24px; border-radius: var(--radius-xl); box-shadow: var(--shadow-sm); display: flex; flex-direction: column; gap: 14px;">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <div>
          <h3 style="font-size: 1.15rem; color: var(--text-main); font-weight: 700;">🔑 6자리 수업 입장 PIN 번호 입력</h3>
          <p style="font-size: 0.85rem; color: var(--text-subtle); margin-top: 2px;">선생님이 전자칠판에 게시한 PIN 번호를 입력해 즉시 입장합니다.</p>
        </div>
        <span class="role-tag" style="background: var(--primary-100); color: var(--primary-800); font-weight: 700;">실시간 수업 연결</span>
      </div>

      <div style="display: flex; gap: 10px; margin-top: 4px;">
        <input type="text" id="inputPinCode" class="form-input" placeholder="6자리 PIN 입력 (예: 782901)" maxlength="6" style="font-size: 1.2rem; font-weight: 800; letter-spacing: 0.1em; text-align: center; text-transform: uppercase;">
        <button class="btn btn-primary" style="padding: 0 28px; white-space: nowrap; font-size: 1rem;" onclick="StudentLobbyModule.enterByPin()">수업 입장하기 →</button>
      </div>
    </div>

    <!-- Live Active Lesson Pulse Card -->
    <div style="background: #ffffff; border: 1px solid var(--border-light); border-radius: var(--radius-xl); padding: 24px;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
        <h3 style="font-size: 1.1rem; color: var(--text-main);">🔴 선생님이 지금 개방한 수업 (실시간)</h3>
        <span style="font-size: 0.8rem; color: var(--accent-teal); font-weight: 700;">● 실시간 라이브</span>
      </div>

      <div id="lobbyActiveLessonContainer">
        <!-- Injected by JS -->
      </div>
    </div>

    <!-- My Learning History List -->
    <div style="background: var(--bg-card); border: 1px solid var(--border-light); border-radius: var(--radius-xl); padding: 24px;">
      <h3 style="font-size: 1.1rem; color: var(--text-main); margin-bottom: 16px;">📚 내가 참여한 활동 및 생각 기록</h3>
      <div style="display: flex; flex-direction: column; gap: 12px;" id="lobbyHistoryContainer">
        <!-- Dynamic history cards inserted by JS -->
      </div>
    </div>

    <!-- Privacy Guidance Box -->
    <div style="background: var(--bg-sidebar); border: 1px solid var(--border-light); padding: 16px 20px; border-radius: var(--radius-lg); font-size: 0.85rem; color: var(--text-subtle); display: flex; align-items: center; gap: 10px;">
      <span style="font-size: 1.2rem;">🔒</span>
      <span><strong>개인정보 보호 약속</strong>: AI 대화 내역은 친구에게 비공개이며, 교사 평가 목적으로 선생님과 학생 본인만 열람할 수 있습니다.</span>
    </div>

  </div>
</section>
